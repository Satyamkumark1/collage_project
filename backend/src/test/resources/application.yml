spring:
  datasource:
    # Set by TestcontainersPostgresExtension's static initializer before any context loads — see
    # docs/DECISIONS.md. Never the real .env DB_URL: JVM system properties outrank OS env vars.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 27MB
  security:
    oauth2:
      client:
        registration:
          # Dummy values: no test drives a real OAuth2Login redirect (needs a real browser
          # consent screen), these only exist so ClientRegistrationRepository has a bean to
          # satisfy SecurityConfig's .oauth2Login(...) at context-load time. See
          # OAuth2UserInfoResolverTest / AuthServiceTest for what's actually exercised.
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,email,profile
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
            scope: read:user,user:email

studyflow:
  jwt:
    # Same env var as the main config (see application.yml, JwtKeyConfig) — a real-looking key
    # hardcoded here would be a checked-in secret even though it's test-only. Tests must be run
    # with the .env sourced, same as the app itself (see CLAUDE.md's verification loop).
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    issuer: studyflow-ai
    audience: studyflow-ai-clients
  cors:
    allowed-origin: http://localhost:5183
  oauth2:
    frontend-redirect-origin: http://localhost:5183
  cookie:
    secure: false
    same-site: Lax
    refresh-ttl-days: 30
  storage:
    local-root: /tmp/studyflow-test-storage
  redis:
    upstash:
      rest-url: ${UPSTASH_REDIS_REST_URL}
      rest-token: ${UPSTASH_REDIS_REST_TOKEN}
  upload:
    max-file-size-bytes: 26214400
  quota:
    uploads-per-month: 100
    ai-jobs-per-month: 60
    tutor-messages-per-day: 30
  ai:
    voyage:
      api-key: ${VOYAGE_API_KEY}
      base-url: https://api.voyageai.com/v1
      model: voyage-4-lite
    groq:
      api-key: ${GROQ_API_KEY}
      api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY}}
      base-url: https://api.groq.com/openai/v1
      models:
        summary: openai/gpt-oss-120b
        tutor: openai/gpt-oss-20b
        key-points: openai/gpt-oss-120b
        mcq: openai/gpt-oss-120b
        flashcard: openai/gpt-oss-120b
  jobs:
    # Background polling would race against tests that construct their own JobDispatcher with a
    # fake handler and call pollOnce() directly — see JobDispatcherIntegrationTest.
    dispatcher:
      enabled: false
    sweeper:
      enabled: false
