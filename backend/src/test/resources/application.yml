spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/studyflow_test
    username: cashify
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 27MB

studyflow:
  jwt:
    secret: 4AXSrXOAzhRxoSu4JhoyVeaiHKskpbxLXqmmsTm1/fxskyqxD2z7LW2YEkn5OIzI70angw8A/PPqubwQnXvUxA==
    access-token-ttl-minutes: 15
    issuer: studyflow-ai
    audience: studyflow-ai-clients
  cors:
    allowed-origin: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax
    refresh-ttl-days: 30
  storage:
    local-root: /tmp/studyflow-test-storage
  upload:
    max-file-size-bytes: 26214400
  quota:
    uploads-per-month: 100
    ai-jobs-per-month: 60
  ai:
    voyage:
      api-key: ${VOYAGE_API_KEY}
      base-url: https://api.voyageai.com/v1
      model: voyage-4-lite
    groq:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      models:
        summary: openai/gpt-oss-120b
  jobs:
    # Background polling would race against tests that construct their own JobDispatcher with a
    # fake handler and call pollOnce() directly — see JobDispatcherIntegrationTest.
    dispatcher:
      enabled: false
    sweeper:
      enabled: false
